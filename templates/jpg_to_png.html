{% extends "base.html" %}
{% block title %}JPG to PNG - QuickToolz{% endblock %}
{% block content %}
<div class="container">
<div class="tool-hero">
    <h1>🖼️ JPG to PNG</h1>
    <p class="subtitle">Convert JPG images to PNG format instantly.</p>
    <p style="color:var(--muted); font-size:0.9rem;">Max file size: 32 MB</p>

    {% if error %}
    <p style="color:#f87171; margin-bottom:16px;">{{ error }}</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        <div class="upload-box">
            <label for="image" class="upload-btn" style="cursor:pointer; display:inline-block;">
                Choose JPG Image
            </label>
            <input type="file" id="image" name="image" accept=".jpg,.jpeg" style="display:none;" onchange="showFileName(this)">
            <p id="fileName" style="margin-top:12px; color:var(--muted);"></p>

            <button type="submit" class="upload-btn" style="margin-top:20px; font-size:1.1rem; padding:16px 40px;">Convert to PNG</button>
        </div>
    </form>
</div>
</div>

<script>
function showFileName(input) {
    const fileNameEl = document.getElementById("fileName");
    if (input.files.length > 0) {
        fileNameEl.innerText = "Selected: " + input.files[0].name;
    }
}
</script>
{% endblock %}
