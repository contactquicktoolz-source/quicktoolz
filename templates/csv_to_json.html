{% extends "base.html" %}
{% block title %}CSV to JSON - QuickToolz{% endblock %}
{% block content %}
<div class="container">
<div class="tool-hero">
    <h1>📊 CSV to JSON</h1>
    <p class="subtitle">Paste CSV data, get JSON instantly.</p>

    <form onsubmit="return false;">
        <textarea id="csvInput" rows="8" placeholder="name,age&#10;Alice,30&#10;Bob,25" oninput="convertCsv()"></textarea>
    </form>
    <div class="result-box" id="csvResult" style="display:none; text-align:left;">
        <pre id="csvOutput" style="white-space:pre-wrap; word-break:break-all; margin:0;"></pre>
    </div>
</div>
</div>

<script>
function convertCsv() {
    const input = document.getElementById("csvInput").value.trim();
    const resultBox = document.getElementById("csvResult");
    if (!input) { resultBox.style.display = "none"; return; }

    const lines = input.split(/\r?\n/).filter(l => l.trim() !== "");
    if (lines.length < 2) { resultBox.style.display = "none"; return; }

    const headers = lines[0].split(",").map(h => h.trim());
    const result = lines.slice(1).map(line => {
        const values = line.split(",");
        const obj = {};
        headers.forEach((h, i) => { obj[h] = values[i] ? values[i].trim() : ""; });
        return obj;
    });

    document.getElementById("csvOutput").textContent = JSON.stringify(result, null, 4);
    resultBox.style.display = "block";
}
</script>
{% endblock %}
