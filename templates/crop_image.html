{% extends "base.html" %}
{% block title %}Crop Image - QuickToolz{% endblock %}
{% block content %}
<div class="container">
<div class="tool-hero">
    <h1>✂️ Crop Image</h1>
    <p class="subtitle">Crop your image by entering exact position and size.</p>
    <p style="color:var(--muted); font-size:0.9rem;">Max file size: 32 MB</p>

    {% if error %}
    <p style="color:#f87171; margin-bottom:16px;">{{ error }}</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        <div class="upload-box">
            <label for="image" class="upload-btn" style="cursor:pointer; display:inline-block;">
                Choose Image
            </label>
            <input type="file" id="image" name="image" accept=".jpg,.jpeg,.png,.webp" style="display:none;" onchange="showFileName(this)">
            <p id="fileName" style="margin-top:12px; color:var(--muted);"></p>

            <div class="quality-row" style="margin-top:16px;">
                <label>X Position (from left)</label>
                <input type="number" name="x" value="0" min="0">
            </div>
            <div class="quality-row">
                <label>Y Position (from top)</label>
                <input type="number" name="y" value="0" min="0">
            </div>
            <div class="quality-row">
                <label>Crop Width</label>
                <input type="number" name="width" value="300" min="1" required>
            </div>
            <div class="quality-row">
                <label>Crop Height</label>
                <input type="number" name="height" value="300" min="1" required>
            </div>

            <button type="submit" class="upload-btn" style="margin-top:20px; font-size:1.1rem; padding:16px 40px;">Crop Image</button>
        </div>
    </form>
</div>
</div>

<script>
function showFileName(input) {
    const fileNameEl = document.getElementById("fileName");
    if (input.files.length > 0) {
        fileNameEl.innerText = "Selected: " + input.files[0].name;
    }
}
</script>
{% endblock %}
