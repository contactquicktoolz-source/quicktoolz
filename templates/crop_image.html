{% extends "base.html" %}
{% block title %}Crop Image - QuickToolz{% endblock %}
{% block content %}
<div class="container">
<div class="tool-hero">
    <h1>✂️ Crop Image</h1>
    <p class="subtitle">Crop your image by entering exact position and size.</p>
    <p style="color:var(--muted); font-size:0.85rem; margin-top:-6px;">Max file size: 32 MB</p>

    {% if error %}
    <p style="color:#f87171; margin-bottom:8px;">{{ error }}</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        <div class="upload-box">
            <label for="image" class="upload-btn" style="cursor:pointer; display:inline-block;">
                Choose Image
            </label>
            <input type="file" id="image" name="image" accept=".jpg,.jpeg,.png,.webp" style="display:none;" onchange="showFileName(this)">
            <p id="fileName" style="margin-top:6px; color:var(--muted); font-size:0.85rem;"></p>

            <div style="display:flex; gap:12px; margin-top:8px; width:100%; max-width:320px;">
                <div class="quality-row" style="flex:1;">
                    <label>X Position</label>
                    <input type="number" name="x" value="0" min="0">
                </div>
                <div class="quality-row" style="flex:1;">
                    <label>Y Position</label>
                    <input type="number" name="y" value="0" min="0">
                </div>
            </div>

            <div style="display:flex; gap:12px; margin-top:6px; width:100%; max-width:320px;">
                <div class="quality-row" style="flex:1;">
                    <label>Crop Width</label>
                    <input type="number" name="width" value="300" min="1" required>
                </div>
                <div class="quality-row" style="flex:1;">
                    <label>Crop Height</label>
                    <input type="number" name="height" value="300" min="1" required>
                </div>
            </div>

            <button type="submit" class="upload-btn" style="margin-top:12px; font-size:1rem; padding:12px 32px;">Crop Image</button>
        </div>
    </form>
</div>
</div>

<script>
function showFileName(input) {
    const fileNameEl = document.getElementById("fileName");
    if (input.files.length > 0) {
        fileNameEl.innerText = "Selected: " + input.files[0].name;
    }
}
</script>
{% endblock %}
