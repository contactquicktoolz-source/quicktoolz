{% extends "base.html" %}
{% block title %}EMI Calculator - QuickToolz{% endblock %}
{% block content %}
<div class="container">
<div class="tool-hero">
    <h1>🏦 EMI Calculator</h1>
    <p class="subtitle">Calculate your monthly loan EMI instantly.</p>

    <form onsubmit="return false;" style="max-width:320px; margin:0 auto;">
        <label>Loan Amount</label>
        <input type="number" id="principal" placeholder="e.g. 500000">
        <label>Interest Rate (% per year)</label>
        <input type="number" id="rate" placeholder="e.g. 8.5" step="0.01">
        <label>Tenure (months)</label>
        <input type="number" id="tenure" placeholder="e.g. 60">
        <button onclick="calcEmi()">Calculate EMI</button>
    </form>
    <div class="result-box" id="emiResult" style="display:none;"></div>
</div>
</div>

<script>
function calcEmi() {
    const p = parseFloat(document.getElementById("principal").value);
    const annualRate = parseFloat(document.getElementById("rate").value);
    const n = parseInt(document.getElementById("tenure").value);
    const box = document.getElementById("emiResult");

    if (!p || !annualRate || !n) { box.textContent = "Please fill all fields correctly."; box.style.display = "block"; return; }

    const r = annualRate / 12 / 100;
    const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
    const totalPayment = emi * n;
    const totalInterest = totalPayment - p;

    box.innerHTML = `Monthly EMI: <strong>₹${emi.toFixed(2)}</strong><br>
                     Total Interest: ₹${totalInterest.toFixed(2)}<br>
                     Total Payment: ₹${totalPayment.toFixed(2)}`;
    box.style.display = "block";
}
</script>
{% endblock %}
