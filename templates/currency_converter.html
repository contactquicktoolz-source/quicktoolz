{% extends "base.html" %}
{% block title %}Currency Converter - QuickToolz{% endblock %}
{% block content %}
<div class="container">
<div class="tool-hero">
    <h1>💱 Currency Converter</h1>
    <p class="subtitle" style="margin-bottom:8px;">Convert between currencies using live exchange rates.</p>

    <form onsubmit="return false;" style="max-width:320px; margin:0 auto;">
        <label>Amount</label>
        <input type="number" id="amountInput" value="1">
        <label>From</label>
        <select id="fromCurrency" class="currency-select">
            <option value="USD">USD - US Dollar</option>
            <option value="INR" selected>INR - Indian Rupee</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - British Pound</option>
            <option value="JPY">JPY - Japanese Yen</option>
            <option value="AED">AED - UAE Dirham</option>
            <option value="AUD">AUD - Australian Dollar</option>
            <option value="CAD">CAD - Canadian Dollar</option>
            <option value="SGD">SGD - Singapore Dollar</option>
            <option value="CNY">CNY - Chinese Yuan</option>
            <option value="SAR">SAR - Saudi Riyal</option>
        </select>
        <label>To</label>
        <select id="toCurrency" class="currency-select">
            <option value="USD" selected>USD - US Dollar</option>
            <option value="INR">INR - Indian Rupee</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - British Pound</option>
            <option value="JPY">JPY - Japanese Yen</option>
            <option value="AED">AED - UAE Dirham</option>
            <option value="AUD">AUD - Australian Dollar</option>
            <option value="CAD">CAD - Canadian Dollar</option>
            <option value="SGD">SGD - Singapore Dollar</option>
            <option value="CNY">CNY - Chinese Yuan</option>
            <option value="SAR">SAR - Saudi Riyal</option>
        </select>
        <button onclick="convertCurrency()" style="margin-top:4px;">Convert</button>
    </form>
    <div class="result-box" id="currResult" style="display:none; margin-top:10px;"></div>

    <div style="max-width:600px; margin:32px auto 0; text-align:left; color:var(--muted); font-size:0.9rem; line-height:1.7;">
        <p>Convert currencies instantly using live exchange rates — no sign-up, no fees, no limits.</p>
    </div>
</div>
</div>

<style>
.currency-select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 16px;
    padding-right: 40px;
    border-radius: 10px;
    cursor: pointer;
}
</style>

<script>
async function convertCurrency() {
    const amount = parseFloat(document.getElementById("amountInput").value);
    const from = document.getElementById("fromCurrency").value;
    const to = document.getElementById("toCurrency").value;
    const box = document.getElementById("currResult");

    if (!amount) { box.textContent = "Enter a valid amount."; box.style.display = "block"; return; }
    box.textContent = "Loading...";
    box.style.display = "block";

    try {
        const res = await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);
        if (!res.ok) throw new Error("API request failed");
        const data = await res.json();
        const rate = data.rates[to];
        if (!rate) throw new Error("Currency not found");
        const result = amount * rate;
        box.innerHTML = `${amount} ${from} = <strong>${result.toFixed(2)} ${to}</strong>`;
    } catch (e) {
        console.error("Currency conversion error:", e);
        box.textContent = "Conversion failed. Please try again.";
    }
}
</script>
{% endblock %}
