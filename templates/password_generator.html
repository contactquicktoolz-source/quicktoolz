{% extends "base.html" %}
{% block title %}Password Generator - QuickToolz{% endblock %}
{% block content %}
<div class="container">
<div class="tool-hero">
    <h1>🔒 Password Generator</h1>
    <p class="subtitle">Generate strong, random passwords instantly.</p>

    <form method="POST">
        <div class="upload-box">
            <div class="quality-row">
                <label>Password Length: <span id="lengthValue">{{ length }}</span></label>
                <input type="range" name="length" min="4" max="64" value="{{ length }}"
                       oninput="document.getElementById('lengthValue').innerText = this.value">
            </div>

            <div class="quality-row" style="flex-direction:column; align-items:flex-start; gap:10px;">
                <label style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" name="use_upper" {% if use_upper %}checked{% endif %}> Uppercase (A-Z)
                </label>
                <label style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" name="use_lower" {% if use_lower %}checked{% endif %}> Lowercase (a-z)
                </label>
                <label style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" name="use_numbers" {% if use_numbers %}checked{% endif %}> Numbers (0-9)
                </label>
                <label style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" name="use_symbols" {% if use_symbols %}checked{% endif %}> Symbols (!@#$%...)
                </label>
            </div>

            <button type="submit" class="upload-btn" style="font-size:1.1rem; padding:16px 40px;">Generate Password</button>
        </div>
    </form>

    {% if password %}
    <div class="result-box">
        <p><strong>Generated Password:</strong></p>
        <p id="generatedPassword" style="font-size:1.3rem; font-family:monospace; word-break:break-all; margin:10px 0;">{{ password }}</p>
        <button onclick="copyPassword()" class="upload-btn" style="padding:10px 24px; font-size:0.95rem;">📋 Copy</button>
    </div>
    {% endif %}
</div>
</div>

<script>
function copyPassword() {
    const text = document.getElementById("generatedPassword").innerText;
    navigator.clipboard.writeText(text).then(() => {
        alert("Password copied to clipboard!");
    });
}
</script>
{% endblock %}
