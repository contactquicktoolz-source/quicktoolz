{% extends "base.html" %}
{% block title %}Color Picker - QuickToolz{% endblock %}
{% block content %}
<div class="container">
<div class="tool-hero">
    <h1>🎨 Color Picker</h1>
    <p class="subtitle">Pick a color, get HEX, RGB, and HSL instantly.</p>

    <input type="color" id="colorInput" value="#6366f1" oninput="updateColor()" style="width:100px; height:60px; border:none; border-radius:12px; cursor:pointer;">

    <div class="result-box" id="colorResult" style="margin-top:16px; text-align:left;">
        <p><strong>HEX:</strong> <span id="hexVal">#6366f1</span></p>
        <p><strong>RGB:</strong> <span id="rgbVal"></span></p>
        <p><strong>HSL:</strong> <span id="hslVal"></span></p>
    </div>
</div>
</div>

<script>
function hexToRgb(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return {r, g, b};
}

function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if (max === min) { h = s = 0; }
    else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
    }
    return {h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100)};
}

function updateColor() {
    const hex = document.getElementById("colorInput").value;
    const {r, g, b} = hexToRgb(hex);
    const {h, s, l} = rgbToHsl(r, g, b);
    document.getElementById("hexVal").textContent = hex;
    document.getElementById("rgbVal").textContent = `rgb(${r}, ${g}, ${b})`;
    document.getElementById("hslVal").textContent = `hsl(${h}, ${s}%, ${l}%)`;
}
document.addEventListener("DOMContentLoaded", updateColor);
</script>
{% endblock %}
